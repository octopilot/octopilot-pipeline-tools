name: CI
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "skaffold.yaml"
      - "base/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    # Same Go paths as push: without them a pull request changing only Go code ran no lint or tests.
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "skaffold.yaml"
      - "base/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Run release/publish jobs?"
        required: false
        default: false
        type: boolean

jobs:
  detect:
    name: Detect Contexts
    runs-on: ubuntu-latest
    outputs:
      pipeline-context: ${{ steps.detect.outputs.pipeline-context }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect Contexts
        id: detect
        uses: octopilot/actions/detect-contexts@main

  lint:
    needs: detect
    if: toJSON(fromJson(needs.detect.outputs.pipeline-context).languages) != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: octopilot/actions/lint@main
        with:
          pipeline-context: ${{ needs.detect.outputs.pipeline-context }}

  test:
    needs: detect
    if: toJSON(fromJson(needs.detect.outputs.pipeline-context).matrix) != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.pipeline-context).matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: octopilot/actions/test@main
        with:
          pipeline-context: ${{ toJson(matrix) }}

  integration:
    needs: [detect, lint, test]
    if: toJSON(fromJson(needs.detect.outputs.pipeline-context).languages) != '[]'
    runs-on: ubuntu-latest
    services:
      registry:
        image: ghcr.io/octopilot/registry-tls:latest
        ports:
          - 5001:5000
    env:
      OP_PACK_NETWORK: host
    steps:
      - uses: actions/checkout@v6
      # - uses: octopilot/actions/janitor@main
      #   with:
      #     pipeline-context: ${{ needs.detect.outputs.pipeline-context }}
      # TODO: re-enable this once we have a better way to test the registry
      # - name: Verify local registry is accessible
      #   uses: octopilot/actions/verify-registry@main
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ fromJson(needs.detect.outputs.pipeline-context).versions.go }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - uses: extractions/setup-just@v3
      - run: just test-integration
        env:
          BP_GO_VERSION: ${{ fromJson(needs.detect.outputs.pipeline-context).versions.op }}

  # ── Job 1: cross-compile Go binaries for all platforms ────────────────────
  # Runs on a fresh runner; no Docker images pulled, minimal disk use.
  # Outputs: dist/op-* uploaded as the "dist-binaries" artifact.
  build-binaries:
    name: Build Release Binaries
    needs: [detect, integration]
    if: toJSON(fromJson(needs.detect.outputs.pipeline-context).languages) != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # - uses: octopilot/actions/janitor@main
      #   with:
      #     pipeline-context: ${{ needs.detect.outputs.pipeline-context }}

      - run: echo "BP_GO_VERSION=${{ fromJson(needs.detect.outputs.pipeline-context).versions.go }}" >> $GITHUB_ENV

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ fromJson(needs.detect.outputs.pipeline-context).versions.go }}

      - name: Build Release Binaries
        uses: octopilot/actions/build-self-homing@main
        with:
          version: ${{ github.ref_name }}
          output_dir: dist

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-binaries
          # op-* binaries only; SBOM comes from the container build job
          path: dist/op-*
          retention-days: 1

  # ── Job 2: build each platform's image on a native runner ─────────────────
  # amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm: no QEMU. Emulated, the arm64 buildpack build took ~40 minutes
  # of v1.2.5's 46-minute container job. Each leg pushes its platform under its own tag (<ref>-<arch>) and hands the
  # digests to publish-container, which assembles the multi-platform indexes.
  build-container:
    name: Build Container (${{ matrix.arch }})
    needs: [detect, build-binaries]
    # On tags: release image (v1.0.x). On push to main: push op:main for integration (--artifact support).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binaries artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-binaries
          path: dist/

      - run: chmod +x dist/op-linux-${{ matrix.arch }}

      - name: Login to GHCR
        if: github.repository_owner == 'octopilot'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/${{ matrix.arch }}
        env:
          BP_GO_VERSION: ${{ fromJson(needs.detect.outputs.pipeline-context).versions.go }}
          ARCH: ${{ matrix.arch }}
          REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # This platform's own tag, for op and for op-base (VERSION is op's tag for the skaffold-built op-base).
          # Never the release tag: publish-container writes that, once, as an index of both platforms.
          TAG="$(printf '%s' "${GITHUB_REF_NAME}" | sed 's/[^A-Za-z0-9_.-]/-/g')-${ARCH}"
          export VERSION="$TAG"
          mkdir -p dist/sbom
          "./dist/op-linux-${ARCH}" build --repo "$REPO" --platform "linux/${ARCH}" --push --tag "$TAG" --sbom-output dist/sbom
          jq -r '.builds[] | "\(.imageName) \(.tag)"' build_result.json | tee "dist/build-${ARCH}.txt"
          tar czf "dist/sbom-${ARCH}.tar.gz" -C dist sbom

      - name: Hand the digests to publish-container
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: |
            dist/build-${{ matrix.arch }}.txt
            dist/sbom-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ── Job 2b: assemble the multi-platform indexes ───────────────────────────
  # The indexes are built from the digests the two legs pushed (not their tags), so a concurrent run cannot swap a
  # platform in. Every entry must be the platform it is listed as, or the job fails.
  publish-container:
    name: Build and Push Container
    needs: [detect, build-container]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Download the platform builds
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/

      - name: Login to GHCR
        if: github.repository_owner == 'octopilot'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish op and op-base indexes
        id: index
        env:
          REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          REF="$(printf '%s' "${GITHUB_REF_NAME}" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          for img in op-base op; do
            srcs=()
            for arch in amd64 arm64; do
              ref="$(awk -v i="$img" '$1 == i { print $2 }' "dist/build-${arch}.txt")"
              [ -n "$ref" ] || { echo "::error::no $img image from the $arch build"; exit 1; }
              tagged="${ref%@*}"
              srcs+=("${tagged%:*}@${ref#*@}")
            done
            # latest follows main and release tags only, never a branch dispatch.
            latest=()
            case "$GITHUB_REF" in refs/heads/main|refs/tags/v*) latest=(-t "$REPO/$img:latest") ;; esac
            docker buildx imagetools create -t "$REPO/$img:$REF" "${latest[@]}" "${srcs[@]}"
            docker buildx imagetools inspect "$REPO/$img:$REF" --raw \
              | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"' > "dist/$img-index.txt"
            cat "dist/$img-index.txt"
            [ "$(cut -d' ' -f1 "dist/$img-index.txt" | sort | tr '\n' ' ')" = "linux/amd64 linux/arm64 " ] \
              || { echo "::error::$img:$REF does not list exactly linux/amd64 and linux/arm64"; exit 1; }
            while read -r platform digest; do
              got="$(docker buildx imagetools inspect "$REPO/$img@$digest" --format '{{json .Image}}' | jq -r '"\(.os)/\(.architecture)"')"
              [ "$got" = "$platform" ] || { echo "::error::$img $digest is $got but listed as $platform"; exit 1; }
            done < "dist/$img-index.txt"
          done
          digest="$(docker buildx imagetools inspect "$REPO/op:$REF" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "op:$REF -> $digest"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          # subject-name must match the registry path where the image is stored.
          # skaffold.yaml image: op → ghcr.io/octopilot/op (not octopilot-pipeline-tools).
          subject-name: ghcr.io/${{ github.repository_owner }}/op
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Combine the SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          for arch in amd64 arm64; do
            mkdir -p "sbom/linux-${arch}"
            tar xzf "dist/sbom-${arch}.tar.gz" -C "sbom/linux-${arch}"
          done
          tar czf dist/sbom.tar.gz sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-sbom
          path: dist/sbom.tar.gz
          if-no-files-found: warn
          retention-days: 1

  # ── Job 3: publish GitHub release ─────────────────────────────────────────
  # Only runs after both the binaries AND the container are successfully built
  # and pushed. Downloads both artifacts and creates the GitHub release.
  publish-release:
    name: Publish GitHub Release
    needs: [detect, build-binaries, publish-container]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binaries artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-binaries
          path: dist/

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-sbom
          path: dist/
        continue-on-error: true  # SBOM is best-effort; don't block the release

      - name: Find Previous Tag
        id: prev_tag
        uses: octopilot/actions/previous-tag@main
        with:
          fallback: "v0.0.0"

      - name: Generate Release Notes
        id: release_notes
        continue-on-error: true
        uses: octopilot/actions/release@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ github.ref_name }}
          since_tag: ${{ steps.prev_tag.outputs.tag }}
          provider: anthropic

      - name: Upload Binaries and SBOM to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/op-*
            dist/sbom.tar.gz
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}

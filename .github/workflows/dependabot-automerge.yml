# Enables GitHub auto-merge on Dependabot PRs: GitHub merges once the checks main's ruleset requires have passed
# (lint, integration, CI result, CodeQL). Runs on a GitHub-hosted runner (pull requests never run on ms02).
# Prereq: repository setting "Allow auto-merge" on.
name: Dependabot Automerge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Automerge Dependabot PRs
    runs-on: ubuntu-24.04
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Majors stay open for review, and so does a 0.x minor bump (0.5 -> 0.6), which semver allows to break though
      # Dependabot calls it minor (27 Oct 2026: argon2 0.6 and rand 0.10 auto-merged into sesame-idam and broke its
      # build). A grouped PR is held if any update in it would be. Patch and other minor bumps queue auto-merge.
      - name: Hold majors and 0.x minors
        id: hold
        env:
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          held="$(jq -r '.[]
            | select(.updateType == "version-update:semver-major"
                     or (.updateType == "version-update:semver-minor"
                         and ((.prevVersion // "") | ltrimstr("v") | startswith("0."))))
            | "\(.dependencyName) \(.prevVersion) -> \(.newVersion)"' <<<"$DEPS")"
          if [ -n "$held" ]; then
            echo "Left open for review:"
            echo "$held"
            echo "hold=true" >> "$GITHUB_OUTPUT"
          else
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable auto-merge (squash)
        if: steps.hold.outputs.hold == 'false'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
